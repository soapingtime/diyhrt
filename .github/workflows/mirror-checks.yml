name: Check mirroring scripts

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: install dependencies
        run: pip install -r scripts/browser-requirements.txt
      - name: test local asset capture and failed downloads
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
