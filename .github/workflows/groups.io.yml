name: groups.io wiki

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 3"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install dependencies
        run: |
          pip install -r scripts/browser-requirements.txt
          playwright install --with-deps chromium
      - name: download groups.io
        run: |
          python scripts/mirror.py groups.io \
            https://groups.io/g/MTFHRT/wiki/ \
            https://groups.io/g/MTFHRT/topic/80225302 \
            https://groups.io/g/MTFHRT/topic/79606271 \
            --accept 'https://groups.io/g/MTFHRT/(wiki(/|$)|topic/([^/?]+/)?(80225302|79606271)([?]|$))' \
            --require-selector .user-content --browser --static --ignore-robots
      - name: commit changes
        if: ${{ success() }}
        uses: EndBug/add-and-commit@v9
        with:
          add: "groups.io"
          pull: --rebase --autostash .
          message: "[automated] update groups.io wiki"
          default_author: github_actions
