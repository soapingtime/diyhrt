name: groups.io wiki

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 3"

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: install dependencies
        run: pip install -r scripts/requirements.txt
      - name: download groups.io
        run: |
          python scripts/mirror.py groups.io https://groups.io/g/MTFHRT/wiki/ https://groups.io/g/MTFHRT/topic/80225302/ https://groups.io/g/MTFHRT/topic/79606271/ --static --ignore-robots
      - name: commit changes
        if: ${{ success() }}
        uses: EndBug/add-and-commit@v9
        with:
          add: "groups.io"
          pull: --rebase --autostash .
          message: "[automated] update groups.io wiki"
          default_author: github_actions
