name: HRTCafe.net

on:
  # hrtcafe.net no longer resolves. Keep the last archive until it returns.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install dependencies
        run: pip install -r scripts/requirements.txt
      - name: download hrtcafe.net
        run: python scripts/mirror.py hrtcafe.net --static --level 5
      - name: commit changes
        if: ${{ success() }}
        uses: EndBug/add-and-commit@v9
        with:
          add: hrtcafe.net
          pull: "--rebase --autostash ."
          message: "[automated] update hrtcafe.net"
          default_author: github_actions
