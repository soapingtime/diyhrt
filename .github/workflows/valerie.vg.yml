name: Valerie.vg

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: install dependencies
        run: pip install -r scripts/browser-requirements.txt
      - name: install Chromium
        run: python -m playwright install --with-deps chromium
      - name: download valerie.vg
        run: python scripts/archive_app.py valerie.vg --reject '/(login|logout|register|admin|accounts)(/|$|[?])'
      - name: commit changes
        if: ${{ success() }}
        uses: EndBug/add-and-commit@v9
        with:
          add: valerie.vg
          pull: "--rebase --autostash ."
          message: "[automated] update valerie.vg"
          default_author: github_actions
